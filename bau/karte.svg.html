<title id="karte-titel">Reliefkarte Zentralchile mit Valle Central</title><desc id="karte-desc">Höhenstufen und Schummerung zwischen 31,8 und 37,2 Grad Süd. Das Valle Central liegt als hellgrüne Senke zwischen Küstenkordillere im Westen und Anden im Osten. Markiert sind Regionen, Flüsse, Städte, Petorca, die Laguna de Aculeo und die Linie des Querschnitts bei 34,2 Grad Süd.</desc>
